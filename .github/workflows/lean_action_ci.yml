# BMS-Well-Ordering-Lean 修改：在上游 CI 基础上增加桥接构建与公理审计。
name: Lean CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  root-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        env:
          LEAN_NUM_THREADS: "1"

  constructible-bridge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        env:
          LEAN_NUM_THREADS: "1"
        with:
          lake-package-directory: ConstructibleBridge
          build: true
          test: false
          lint: false
          axiom-audit: true
          # 审计入口是模块根（lean_lib），不是声明所在的 namespace。
          axiom-audit-root: BMSConstructibleBridge
      - name: Check reusable BMS tools dependencies
        env:
          LEAN_NUM_THREADS: "1"
        working-directory: ConstructibleBridge
        run: lake env lean BMSTools/Audit.lean
      - name: Build every bridge source module
        env:
          LEAN_NUM_THREADS: "1"
        working-directory: ConstructibleBridge
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          targets=()
          for source in BMSConstructibleBridge/**/*.lean BMSTools/**/*.lean; do
            module="${source%.lean}"
            targets+=("${module//\//.}")
          done
          for ((offset=0; offset<${#targets[@]}; offset+=64)); do
            log="$(mktemp)"
            lake build "${targets[@]:offset:64}" 2>&1 | tee "$log"
            if grep -Eq 'declaration uses .sorry.|sorryAx' "$log"; then
              echo "Unfinished Lean proof detected in bridge build."
              exit 1
            fi
          done
      - name: Check original final BMS theorem axioms
        working-directory: ConstructibleBridge
        run: lake env lean BMSConstructibleBridge/AxiomAudit.lean
      - name: Check finite boundary proof dependencies
        working-directory: ConstructibleBridge
        run: lake env lean BMSConstructibleBridge/FiniteBoundaryAudit.lean
      - name: Check second-order presentation dependencies
        working-directory: ConstructibleBridge
        run: lake env lean BMSConstructibleBridge/SecondOrderAudit.lean
      - name: Check third-order background dependencies
        working-directory: ConstructibleBridge
        run: lake env lean BMSConstructibleBridge/ThirdOrderAudit.lean
