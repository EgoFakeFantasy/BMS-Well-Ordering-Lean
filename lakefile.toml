name = "YesMetaZFC"
version = "0.1.0"
defaultTargets = ["YesMetaZFC"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[lean_lib]]
name = "YesMetaZFC"

[[lean_exe]]
name = "prove_auto_sweep"
root = "YesMetaZFC.Automation.Tools.ProveAutoSweep"
supportInterpreter = true
